<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Notification Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <a class="top-bar__name top-bar__name--link" href="/" data-route="/">Job Notification Tracker</a>
      <nav class="top-bar__nav" aria-label="Main">
        <a class="top-bar__link" href="/dashboard" data-route="/dashboard">Dashboard</a>
        <a class="top-bar__link" href="/saved" data-route="/saved">Saved</a>
        <a class="top-bar__link" href="/digest" data-route="/digest">Digest</a>
        <a class="top-bar__link" href="/settings" data-route="/settings">Settings</a>
        <a class="top-bar__link" href="/proof" data-route="/proof">Proof</a>
      </nav>
      <button type="button" class="top-bar__menu-btn" id="nav-menu-btn" aria-expanded="false" aria-label="Open menu">
        <span class="top-bar__menu-btn-icon" aria-hidden="true"></span>
      </button>
      <div class="nav-dropdown" id="nav-dropdown" aria-hidden="true">
        <a class="top-bar__link" href="/dashboard" data-route="/dashboard">Dashboard</a>
        <a class="top-bar__link" href="/saved" data-route="/saved">Saved</a>
        <a class="top-bar__link" href="/digest" data-route="/digest">Digest</a>
        <a class="top-bar__link" href="/settings" data-route="/settings">Settings</a>
        <a class="top-bar__link" href="/proof" data-route="/proof">Proof</a>
      </div>
    </header>

    <main id="route-outlet">
      <section class="route-content landing">
        <h1 class="heading-1">Stop Missing The Right Jobs.</h1>
        <p class="subtext">Precision-matched job discovery delivered daily at 9AM.</p>
        <p class="landing__cta"><a href="/settings" class="btn btn--primary">Start Tracking</a></p>
      </section>
    </main>
  </div>
  <script src="js/router.js"></script>
</body>
</html>
